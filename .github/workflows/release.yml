name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from Cargo.toml, without the leading "v"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: featbit-openfeature-provider
  RUST_VERSION: 1.97.1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install release toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Validate branch, version, and tag
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be run from the main branch, not ${RELEASE_REF}."
            exit 1
          fi

          manifest_version="$(
            cargo "+${RUST_VERSION}" metadata --locked --no-deps --format-version 1 |
              jq -r --arg package "$PACKAGE_NAME" \
                '.packages[] | select(.name == $package) | .version'
          )"

          if [[ -z "$manifest_version" ]]; then
            echo "::error::Package ${PACKAGE_NAME} was not found in Cargo metadata."
            exit 1
          fi

          if [[ "$RELEASE_VERSION" != "$manifest_version" ]]; then
            echo "::error::Requested version ${RELEASE_VERSION} does not match Cargo.toml version ${manifest_version}."
            exit 1
          fi

          tag="v${manifest_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          prerelease=false
          if [[ "$manifest_version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "prerelease=${prerelease}"
            echo "tag=${tag}"
            echo "version=${manifest_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo "+${RUST_VERSION}" fmt --all -- --check

      - name: Run Clippy
        run: cargo "+${RUST_VERSION}" clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo "+${RUST_VERSION}" test --all-features

      - name: Run documentation tests
        run: cargo "+${RUST_VERSION}" test --doc

      - name: Compile examples
        run: cargo "+${RUST_VERSION}" check --examples --all-features

      - name: Inspect package contents and duplicate dependencies
        run: |
          cargo "+${RUST_VERSION}" package --list --locked
          cargo "+${RUST_VERSION}" tree -d

      - name: Verify publish package
        run: cargo "+${RUST_VERSION}" publish --dry-run --locked

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install release toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Check whether the crate version is already published
        id: registry
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          encoded_version="$(jq -rn --arg value "$RELEASE_VERSION" '$value | @uri')"
          status="$(
            curl --silent --show-error --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --user-agent 'featbit-openfeature-provider-release-workflow' \
              "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${encoded_version}"
          )"

          case "$status" in
            200)
              echo "Version ${RELEASE_VERSION} is already on crates.io; skipping publication."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Version ${RELEASE_VERSION} is not on crates.io yet."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected crates.io response status: ${status}."
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo "+${RUST_VERSION}" publish --locked

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
